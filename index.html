<style>
:root{--ink:#2b1a0e;--edge:#7d5a2c;--ru:#8e2a2a;--st:#3d5a80;--vi:#5e3f87;--em:#3b6b4a;--bg:#34302b;--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .08 0 0 0 .45 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:18px/1.3 'IM Fell English',Georgia,serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #c33;outline-offset:2px}
h1,h2,.f{font-family:'Pirata One',Georgia,serif;font-weight:400}
#bn{background:#1f1610;color:#ecdcb2;text-align:center;padding:6px;font-size:15px;border:0;width:100%}
#app{flex:1;min-height:0;width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:12px 14px;box-sizing:border-box;overflow-y:auto;background:var(--noise),radial-gradient(ellipse at 50% 0,var(--p1,#efdfb6),var(--p2,#d9bf88) 70%,var(--p3,#c4a56e));box-shadow:inset 0 0 50px rgba(110,70,20,.5)}
.sc{position:relative;display:block;width:80%;margin:10px auto;padding:10px 22px;border:2px solid var(--edge);border-radius:6px;background:var(--noise),linear-gradient(#ecdcb0,#d3b87f);font:26px 'Pirata One',serif;text-align:center;box-shadow:0 2px 0 #5e4220}
.sc::before,.sc::after{content:"";position:absolute;top:-5px;bottom:-5px;width:15px;border:2px solid var(--edge);border-radius:9px;background:linear-gradient(90deg,#a98650,#e8d29e,#a98650)}
.sc::before{left:-10px}.sc::after{right:-10px}
.sc i{position:absolute;right:8px;bottom:-9px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d44,#7a1414);box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:1}
.sc.sm{font-size:21px;padding:7px 18px}
.pn{border:2px solid var(--edge);outline:1px solid var(--edge);outline-offset:-6px;border-radius:6px;background:var(--noise),rgba(236,220,176,.55);padding:10px 12px}
.ttl{font:56px/1 'Pirata One',serif;text-align:center;margin:0}
.sub{text-align:center;font-style:italic}
.bar{height:11px;background:#3a2a18;border-radius:6px;overflow:hidden;border:1px solid var(--edge)}
.bar i{display:block;height:100%;transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;font-size:19px}
.pill{border:1px solid var(--edge);border-radius:999px;padding:0 9px;background:rgba(255,255,255,.3);white-space:nowrap}
.en{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;text-align:center;min-height:130px}
.en .e{font-size:62px;line-height:1}.en img,.card img{max-height:80px;max-width:100%}
.hit{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.log{font-size:15px;min-height:60px;color:#5a4128}.log p{margin:0}.log p:last-child{color:var(--ink);font-weight:700}
.hand{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.card{flex:0 0 104px;text-align:left;display:flex;flex-direction:column;min-height:148px;border:2px solid var(--edge);border-radius:7px;background:var(--noise),#efe0b8;padding:0;overflow:hidden}
.card:disabled{opacity:.45}
.card .h{display:flex;justify-content:space-between;align-items:center;padding:4px 7px;color:#fff;font-size:20px}
.card .h b{background:#ecdcb2;color:var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:14px}
.card .n{font:16px/1.1 'Pirata One',serif;padding:5px 7px 0}.card .x{font-size:13px;padding:2px 7px 7px;line-height:1.2}
.atk .h{background:var(--ru)}.def .h{background:var(--st)}.mag .h{background:var(--vi)}.sup .h{background:var(--em)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch{border:2px solid var(--edge);border-radius:8px;background:rgba(255,255,255,.3);padding:4px 10px;margin:3px 3px 3px 0}
.ch.on{background:#d9b86d;border-color:var(--ru);font-weight:700}
.row{display:flex;flex-wrap:wrap}
input.nm{width:100%;box-sizing:border-box;border:2px solid var(--edge);border-radius:6px;background:rgba(255,255,255,.4);padding:6px 10px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid var(--edge);border-radius:6px;background:rgba(255,255,255,.3);padding:6px;text-align:center;font-size:14px;line-height:1.15;min-height:78px}
.tile .i{font-size:30px;line-height:1.1}
.sr{display:flex;gap:6px;flex-wrap:wrap}
.seal{width:44px;height:44px;border-radius:50%;margin:0 auto;display:grid;place-items:center;color:#f3c7c7;font-size:22px;background:radial-gradient(circle at 35% 30%,#d44,#7a1414);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.ctr{text-align:center}h2{font-size:30px;margin:0;text-align:center}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app{overflow-x:hidden}#app *{overflow-wrap:anywhere}
.top{flex-wrap:wrap;gap:6px}.top .f{flex:1 1 150px}.foot{flex-wrap:wrap}
.ttl{font-size:clamp(38px,15vw,56px)}.en .e{font-size:clamp(48px,18vw,64px)}
.sc{max-width:calc(100% - 40px);line-height:1.1}.gr{grid-template-columns:repeat(2,minmax(0,1fr))}
.en{position:relative}.pw{position:relative;display:inline-block}
.fl{position:absolute;font:30px 'Pirata One',serif;pointer-events:none;z-index:3;animation:fl 1s ease-out forwards;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.en .fl{left:50%;top:28%;margin-left:-20px}.pw .fl{right:0;top:26px;font-size:24px}.pw .fl.g{right:64px}
.fl.r{color:#a8322f}.fl.m{color:#5a4128;font-size:24px}.fl.g{color:#2f7a4a}.fl.b{color:#3d5a80}.fl.big{font-size:46px;color:#b87a00}
.d20{position:absolute;left:10px;top:10px;width:46px;height:50px;display:grid;place-items:center;font:22px 'Pirata One',serif;background:#ecdcb2;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:roll .55s ease-out both}
.d20.ok{background:#bfdcaa}.d20.no{background:#dcbfb0}.d20.crit{background:#f0cf6a}
.lunge{animation:lunge .4s}.die{animation:die .65s forwards}
.card.deal,.tile.pop{animation:deal .35s both;animation-delay:calc(var(--i,0)*60ms)}
.sw>*{animation:rise .3s both}.seal{animation:pulse 3s ease-in-out infinite}
.sc:active{transform:translateY(2px)}.card:active:not(:disabled){transform:scale(.96)}
.vig{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px 30px rgba(190,30,30,.75);animation:vig .6s forwards}
@keyframes fl{0%{opacity:0;transform:translateY(8px) scale(.6)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-46px)}}
@keyframes roll{0%{transform:rotate(-540deg) scale(.2);opacity:0}100%{transform:none;opacity:1}}
@keyframes deal{0%{transform:translateY(40px) rotate(6deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes lunge{40%{transform:translateY(22px) scale(1.2)}}
@keyframes die{to{transform:rotate(25deg) scale(.6);opacity:0;filter:grayscale(1)}}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes vig{0%{opacity:1}100%{opacity:0}}@keyframes pulse{50%{transform:scale(1.12)}}
html{height:100dvh}#app>*{flex-shrink:0}.en{flex:1 1 100px;min-height:100px}
.hand{flex:0 0 auto}.card{min-height:0;border-color:var(--cb,#7d5a2c)}.log{min-height:50px}
.sr{align-items:center}.sr .ch{padding:3px 9px;font-size:15px}
.bpr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px}
@media(max-height:680px){.card .x{font-size:12px}.en .e{font-size:44px}}
.en{min-height:min-content}.top .f{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-height:700px){.log p:not(:last-child){display:none}.log{min-height:0}.hand{padding-bottom:2px}}
@media(max-height:660px){.en .e{font-size:36px}.pn.en{padding:6px 10px;gap:2px}.log{min-height:40px}.top{font-size:17px}}
@media(max-height:600px){.en{min-height:70px;gap:2px}.en .e{font-size:36px}.log{min-height:36px}.top{font-size:17px}.card .n{font-size:14px}}

.tav{background:var(--noise),linear-gradient(#2b1c10,#3b2616 60%,#2b1c10);border-radius:8px;padding:10px 8px 14px;box-shadow:inset 0 0 40px rgba(0,0,0,.7);position:relative;overflow:hidden}
.tav::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 0,rgba(255,170,60,.38),transparent 55%);animation:flick 3s ease-in-out infinite;pointer-events:none}
.tavsub{color:#e8d6aa;font-size:14px;margin-bottom:10px}
.brd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 12px;padding:20px 12px 14px;border:10px solid #5a3a1e;border-radius:6px;background:var(--noise),#a77b4a;box-shadow:inset 0 0 30px rgba(0,0,0,.55),0 4px 0 #3a2410}
.note{position:relative;transform:rotate(var(--r));background:var(--noise),#ecdcb0;border:1px solid #9a7a45;padding:20px 6px 8px;text-align:center;box-shadow:2px 4px 6px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:2px;min-height:100px;border-radius:2px;color:var(--ink);transition:transform .15s}
.note b{font-size:19px;line-height:1.05}.note small{font-size:13px}
.note.sel{outline:3px solid #c33;outline-offset:3px;transform:rotate(0) scale(1.05);z-index:2}
.dag{position:absolute;top:-22px;left:50%;margin-left:-9px;width:18px;height:40px;transform:rotate(180deg);filter:drop-shadow(1px 2px 1px rgba(0,0,0,.5));pointer-events:none}
@keyframes flick{50%{opacity:.55}}
.abl{font-size:13px;color:#5a4128;line-height:1.15}.stl{font-size:17px}
.warn{background:#8e2a2a;color:#fff;border-radius:6px;padding:3px 10px;font-weight:700;font-size:15px;animation:pulse 1.2s infinite}
.coin{width:1.05em;height:1.05em;vertical-align:-.15em}
.stg{min-height:300px;padding:22px 14px;text-align:center}.npc{font-size:72px;line-height:1.1;animation:rise .4s both}
.bub{background:var(--noise),#ecdcb0;color:var(--ink);border:2px solid #9a7a45;border-radius:10px;padding:14px 16px;font-size:19px;line-height:1.3;margin:10px 2px;box-shadow:0 3px 8px rgba(0,0,0,.5);animation:rise .3s both}
.dots{color:#e8d6aa;letter-spacing:4px}
.hlp{text-align:left;font-size:16px;animation:rise .3s both}.hlp p{margin:6px 0;line-height:1.3}
.stats{display:flex;flex-wrap:wrap;gap:6px}.stats .pill{padding:0 8px}.card.sel{outline:3px solid #c33;outline-offset:2px}
.swc{width:32px;height:32px;border-radius:50%;border:3px solid #7d5a2c;padding:0;margin:3px 3px 3px 0}.swc.on{border-color:#c33;box-shadow:0 0 0 2px #fff}.avatar{display:inline-block;vertical-align:middle}.acc{display:flex;flex-direction:column;gap:2px;margin:-4px 0 6px}
.row .card{flex:0 1 104px;min-width:0}
.tipbg{position:fixed;inset:0;z-index:20;background:rgba(15,10,5,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.tipbox{width:100%;max-width:480px;background:var(--noise),#ecdcb0;border:3px solid var(--edge);border-radius:12px;padding:14px 16px;color:var(--ink);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6);animation:rise .3s both}
.tiptt{font-size:28px;line-height:1.1}.tipbox p{margin:8px 0;font-size:18px;line-height:1.3}.tipbox .dots{color:#7d5a2c}.tipbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

.card,.pill,.tile,.ch,.hand,.log{position:relative}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#app:focus{outline:none}
.ch{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:4px 12px}
.sr .ch{min-width:44px;padding:4px 8px}
.swc{width:44px;height:44px;margin:2px 4px 2px 0}
.sc.sm{min-height:44px}#bn{min-height:44px;display:block}
#ub{display:none;width:100%;min-height:44px;border:0;padding:6px;font-size:16px;font-weight:bold;background:#b8860b;color:#1f1610}#ub.on{display:block}html.hc #ub{background:#ff0;color:#000}
.card .h{gap:4px}.ty{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:#fff;margin-right:auto}
.seal{color:#fff}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.tz1 #app{zoom:1.15}html.tz2 #app{zoom:1.3}
html.hc{--noise:none;--ink:#000;--edge:#000}
html.hc #app{background:#fbf3dc!important;box-shadow:none!important}
html.hc .sc,html.hc .note,html.hc .tipbox{background:#fff3cc!important;border:3px solid #000!important;color:#000}
html.hc .pn,html.hc .bub,html.hc .tile{background:#fffaf0!important;border-color:#000!important;outline-color:#000!important;color:#000}
html.hc .ch,html.hc .pill{background:#fff!important;border:2px solid #000!important;color:#000}
html.hc .ch.on{background:#000!important;color:#fff!important}
html.hc .card{background:#fff!important;border:3px solid #000!important}
html.hc .card .x,html.hc .card .n{color:#000}
html.hc small,html.hc .abl,html.hc .log,html.hc .log p{color:#000!important}
html.hc #bn{background:#000;color:#fff}
html.hc .tavsub,html.hc .stg .f,html.hc .dots{color:#fff!important}
html.hc button:focus-visible,html.hc input:focus-visible{outline:4px solid #0050ff!important}
.acc .sc{width:66%;max-width:calc(100% - 56px);margin:6px 9% 6px auto;font-size:19px;padding:5px 12px;min-height:44px}
.acc .sc::before,.acc .sc::after{width:11px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const HELP=[
['Goal','Campaign: pick quests from the tavern board and clear dungeons. Defend the Walls: endless waves. A Fantasy Life: a long story shaped by your choices.','Obiettivo','Campagna: scegli le missioni dalla bacheca della taverna e supera i dungeon. Difendete le mura: ondate infinite. A Fantasy Life: una lunga storia plasmata dalle tue scelte.'],
['Your turn','You have 3 energy and draw 5 cards. Tap a card to play it: its cost is the number in the circle. Press End turn when done, then the enemy attacks (its damage is hidden).','Il tuo turno','Hai 3 energie e peschi 5 carte. Tocca una carta per giocarla: il costo è il numero nel cerchio. Premi Fine turno: poi attacca il nemico (i suoi danni sono nascosti).'],
['Dice and spells','Attacks roll a d20 plus bonuses against the enemy AC: a 20 is a critical hit, a 1 always misses. Spells always hit. Block absorbs damage and resets every turn.','Dadi e incantesimi','Gli attacchi tirano un d20 più i bonus contro la CA del nemico: 20 è un critico, 1 manca sempre. Gli incantesimi colpiscono sempre. Il Blocco assorbe i danni e si azzera ogni turno.'],
['Statuses','Poison hurts every turn. Stun makes a foe skip its attack. Weaken cuts its damage. Frail reduces your Block. Rage boosts your attacks but you take more damage. Mark makes the prey take extra damage.','Stati','Il Veleno ferisce ogni turno. Lo Stordimento fa saltare l’attacco al nemico. Indebolire riduce i suoi danni. Fragile riduce il tuo Blocco. L’Ira potenzia i tuoi attacchi ma subisci più danni. Il Marchio fa subire più danni alla preda.'],
['Enemies','Every monster has an ability, written under its name. A red warning means a powerful attack is coming this turn: Block!','Nemici','Ogni mostro ha un’abilità, scritta sotto il suo nome. Un avviso rosso indica un attacco potente in arrivo in questo turno: para!'],
['Campaign','Read the quest, then fight room after room. After each fight pick a card and a path (rest, event or danger). Win to earn XP, gold and a consumable. Level up for more HP.','Campagna','Leggi la missione e affronta le stanze una dopo l’altra. Dopo ogni scontro scegli una carta e un sentiero (riposo, evento o pericolo). Vinci per ottenere XP, oro e un consumabile. Salendo di livello hai più PF.'],
['A Fantasy Life','Live a whole life, year by year. Choose an ambition: your stats (Might, Mind, Charm, Faith, Fame, Gold and Crime) decide which path you really follow, and a meter shows whether you are getting closer. Short on gold? You may try to steal, but a failed stealth check costs fame and starts a fight. Games of chance and defeats raise your Luck, which helps your rolls and may let you cheat death. Choices give you cards and fights use them. Your best card can pass to your next life.','A Fantasy Life','Vivi un’intera vita, anno dopo anno. Scegli un’ambizione: le tue statistiche (Forza, Mente, Carisma, Fede, Fama, Oro e Criminalità) decidono quale percorso segui davvero, e un indicatore mostra se ti stai avvicinando. Senza oro? Puoi provare a rubare, ma una prova di furtività fallita costa fama e scatena uno scontro. Giochi d’azzardo e sconfitte aumentano la Fortuna, che aiuta i tuoi tiri e può farti eludere la morte. Le scelte ti danno carte e gli scontri le usano. La tua carta migliore può passare alla vita successiva.'],
['Gold and defeat','Every 3 dungeons a merchant visits the tavern: buy and sell gear. If you fall or retreat you lose 1d20 gold, but you keep everything else you found.','Oro e sconfitta','Ogni 3 dungeon un mercante visita la taverna: compra e vendi equipaggiamento. Se cadi o ti ritiri perdi 1d20 monete, ma tieni tutto il resto.'],
['Battle Pass','Earn points after each run to unlock consumables, themes, titles and card frames.','Battle Pass','Ottieni punti a fine partita per sbloccare consumabili, temi, titoli e cornici per le carte.'],
['Saving','The game saves by itself and every mode keeps its own save: open the mode and press Continue. You can go back to the main menu at any time and lose nothing. To move to another device use Save Data.','Salvataggio','Il gioco salva da solo e ogni modalità ha il suo salvataggio: apri la modalità e premi Continua. Puoi tornare al menu principale in qualsiasi momento senza perdere nulla. Per passare a un altro dispositivo usa Dati di salvataggio.'],
['Handy buttons','In battle: 🎵 music, 🔊 sound, 🏠 main menu (your game is saved), 🏳️ surrender (it counts as a defeat; in Defend the Walls you keep your points). In the main menu, Accessibility lets you reduce motion, enlarge the text, raise the contrast and turn vibration off and have the game read each screen aloud (turn this off if you already use TalkBack or VoiceOver).','Pulsanti utili','In battaglia: 🎵 musica, 🔊 suoni, 🏠 menu principale (la partita resta salvata), 🏳️ resa (conta come sconfitta; nelle mura tieni i punti). Nel menu principale, Accessibilità permette di ridurre le animazioni, ingrandire il testo, aumentare il contrasto e togliere la vibrazione e far leggere ad alta voce ogni schermata (da spegnere se usi già TalkBack o VoiceOver).']];
